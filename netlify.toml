# Netlify build config for the Nuxt 3 (Nitro) app.
# Nitro auto-detects Netlify and uses its `netlify` preset, which outputs the
# static assets to `dist/` and the SSR handler as a Netlify Function. We pin the
# publish dir + Node version so the deploy is deterministic.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Nuxt's runtimeConfig inlines the SMTP_* values into the server function bundle
  # (.netlify/functions-internal) — server-side only, never shipped to the browser.
  # Exclude that build output from Netlify's secrets scanner so the deploy doesn't fail.
  SECRETS_SCAN_OMIT_PATHS = ".netlify/functions-internal/**"
